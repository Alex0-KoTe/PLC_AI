; PlatformIO Project Configuration File — UsKoTE v2 (обновлённый проект)
; Базируется на структуре PLC_AI (v1): 6 каналов, DS18B20, Modbus TCP, веб-UI

[env:uskote_v2]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = custom_partitions.csv
board_upload.flash_size = 4MB
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_flags =
        -DCORE_DEBUG_LEVEL=1
        -O2
lib_deps =
        milesburton/DallasTemperature@^3.11.0
        paulstoffregen/OneWire@^2.3.8
